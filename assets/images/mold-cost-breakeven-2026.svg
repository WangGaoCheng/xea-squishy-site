<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">2026 Custom Squishy Unit Cost Break-Even: DIY vs Factory OEM Molds</title>
  <desc id="chart-desc">Comparison of effective landed unit cost per 110g squishy toy at 100, 1000, and 5000 pcs across DIY Silicone Kit, Factory Silicone Master Mold, and 4-Cavity P20 Steel TPR Mold.</desc>
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Top Header Band -->
  <rect x="0" y="0" width="960" height="92" rx="20" fill="#0f172a"/>
  <rect x="0" y="72" width="960" height="20" fill="#0f172a"/>
  <text x="36" y="38" class="font" font-size="12" font-weight="800" fill="#60a5fa" letter-spacing="1.4">XEA JINHUA TOOLROOM · 2026 B2B COST BENCHMARK</text>
  <text x="36" y="68" class="font" font-size="22" font-weight="800" fill="#ffffff">Effective Cost Per 110g Squishy Toy (Tooling + Material + Labor)</text>

  <!-- Legend -->
  <g transform="translate(36, 114)" class="font" font-size="13" font-weight="600" fill="#334155">
    <rect x="0" y="-11" width="14" height="14" rx="4" fill="#94a3b8"/>
    <text x="22" y="1">DIY Silicone Kit ($35–$150)</text>

    <rect x="235" y="-11" width="14" height="14" rx="4" fill="#2563eb"/>
    <text x="257" y="1">Factory Silicone Master Mold ($650)</text>

    <rect x="530" y="-11" width="14" height="14" rx="4" fill="#10b981"/>
    <text x="552" y="1">4-Cavity Steel TPR Mold ($1,850)</text>
  </g>

  <!-- Horizontal Grid Lines & Y-Axis ($0 to $8 scale, capped bar for $19.35) -->
  <g class="font" font-size="12" font-weight="600" fill="#64748b">
    <line x1="80" y1="410" x2="916" y2="410" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="68" y="414" text-anchor="end">$0</text>

    <line x1="80" y1="352" x2="916" y2="352" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="68" y="356" text-anchor="end">$2</text>

    <line x1="80" y1="294" x2="916" y2="294" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="68" y="298" text-anchor="end">$4</text>

    <line x1="80" y1="236" x2="916" y2="236" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="68" y="240" text-anchor="end">$6</text>

    <line x1="80" y1="178" x2="916" y2="178" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="68" y="182" text-anchor="end">$8+</text>
  </g>

  <!-- GROUP 1: 100 PCS (Concept Test) -->
  <g transform="translate(125, 0)">
    <!-- DIY: $3.85 (height = 3.85 * 29 = 112px -> y = 298) -->
    <rect x="0" y="298" width="54" height="112" rx="8" fill="#94a3b8"/>
    <rect x="-4" y="266" width="62" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="27" y="282" text-anchor="middle" class="font" font-size="12" font-weight="800" fill="#047857">$3.85</text>

    <!-- Silicone Master: $7.90 (height = 7.9 * 29 = 229px -> y = 181) -->
    <rect x="66" y="181" width="54" height="229" rx="8" fill="#2563eb" opacity="0.85"/>
    <text x="93" y="172" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#1e3a8a">$7.90</text>

    <!-- Steel 4-Cavity: $19.35 (capped at y=162 with break hatch) -->
    <rect x="132" y="162" width="54" height="248" rx="8" fill="#10b981" opacity="0.35" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="159" y="153" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#065f46">$19.35*</text>

    <text x="93" y="438" text-anchor="middle" class="font" font-size="14" font-weight="800" fill="#0f172a">100 pcs</text>
    <text x="93" y="456" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#64748b">Winner: DIY Kit / Stock</text>
  </g>

  <!-- GROUP 2: 1,000 PCS (Small Brand Launch) -->
  <g transform="translate(410, 0)">
    <!-- DIY: $3.25 (height = 94px -> y = 316) -->
    <rect x="0" y="316" width="54" height="94" rx="8" fill="#94a3b8"/>
    <text x="27" y="307" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#475569">$3.25</text>

    <!-- Silicone Master: $1.95 (height = 57px -> y = 353) WINNER -->
    <rect x="66" y="353" width="54" height="57" rx="8" fill="#2563eb"/>
    <rect x="62" y="321" width="62" height="24" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="93" y="337" text-anchor="middle" class="font" font-size="12" font-weight="800" fill="#1d4ed8">$1.95</text>

    <!-- Steel 4-Cavity: $2.60 (height = 75px -> y = 335) -->
    <rect x="132" y="335" width="54" height="75" rx="8" fill="#10b981" opacity="0.8"/>
    <text x="159" y="326" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#065f46">$2.60</text>

    <text x="93" y="438" text-anchor="middle" class="font" font-size="14" font-weight="800" fill="#0f172a">1,000 pcs</text>
    <text x="93" y="456" text-anchor="middle" class="font" font-size="11" font-weight="600" fill="#2563eb">Winner: Silicone Master</text>
  </g>

  <!-- GROUP 3: 5,000 PCS (Amazon FBA / Retail Scale) -->
  <g transform="translate(695, 0)">
    <!-- DIY: Unfeasible -->
    <rect x="0" y="366" width="54" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="27" y="392" text-anchor="middle" class="font" font-size="10" font-weight="700" fill="#94a3b8">N/A</text>
    <text x="27" y="357" text-anchor="middle" class="font" font-size="10" font-weight="600" fill="#94a3b8">250+ days</text>

    <!-- Silicone Master: $1.39 (height = 40px -> y = 370) -->
    <rect x="66" y="370" width="54" height="40" rx="8" fill="#2563eb" opacity="0.8"/>
    <text x="93" y="361" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#1e3a8a">$1.39</text>

    <!-- Steel 4-Cavity: $1.12 (height = 32px -> y = 378) WINNER -->
    <rect x="132" y="378" width="54" height="32" rx="8" fill="#10b981"/>
    <rect x="128" y="344" width="62" height="24" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="159" y="360" text-anchor="middle" class="font" font-size="12" font-weight="800" fill="#047857">$1.12</text>

    <text x="93" y="438" text-anchor="middle" class="font" font-size="14" font-weight="800" fill="#0f172a">5,000 pcs</text>
    <text x="93" y="456" text-anchor="middle" class="font" font-size="11" font-weight="700" fill="#047857">Winner: 4-Cavity Steel (-71%)</text>
  </g>

  <!-- Footer Note -->
  <text x="36" y="498" class="font" font-size="11" fill="#64748b">*Capped visually at $8+ scale ($19.35 actual at 100 pcs). Source: XEA Jinhua Mold Workshop 2026 FOB Cost Model (110g toy, excl. freight).</text>
</svg>
