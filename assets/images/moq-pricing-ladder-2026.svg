<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="l-title l-desc">
  <title id="l-title">XEA 3-Tier Wholesale &amp; OEM Scaling Ladder (1 Carton to Full Container)</title>
  <desc id="l-desc">B2B scaling tiers: Tier 1 Stock Trial (1 carton, $0 mold fee), Tier 2 Private Label (500-1,000 pcs logo/packaging), Tier 3 Exclusive 3D OEM Molding (3,000+ pcs, 100% mold rebate at 30,000 pcs).</desc>
  <defs><style>.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}</style></defs>
  <rect width="960" height="400" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="960" height="84" rx="20" fill="#0f172a"/>
  <rect y="64" width="960" height="20" fill="#0f172a"/>
  <text x="36" y="34" class="f" font-size="12" font-weight="800" fill="#60a5fa" letter-spacing="1.4">XEA JINHUA DIRECT · LOW-RISK SCALING PATH</text>
  <text x="36" y="62" class="f" font-size="22" font-weight="800" fill="#ffffff">3-Tier Wholesale &amp; Custom OEM Program (Start With 1 Carton)</text>

  <!-- Tier 1 -->
  <g transform="translate(36, 114)">
    <rect width="280" height="230" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
