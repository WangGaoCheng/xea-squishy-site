    <text x="20" y="62" class="f" font-size="20" font-weight="800" fill="#0f172a">1 Master Carton</text>
    <text x="20" y="84" class="f" font-size="12" font-weight="700" fill="#475569">24 – 144 pcs · $0 Mold Fee</text>
    <line x1="20" y1="100" x2="260" y2="100" stroke="#e2e8f0"/>
    <text x="20" y="124" class="f" font-size="12" fill="#334155">• Pick from 150 ready CPC SKUs</text>
    <text x="20" y="146" class="f" font-size="12" fill="#334155">• Dispatches in 3–5 business days</text>
    <text x="20" y="168" class="f" font-size="12" fill="#334155">• Optional FNSKU barcode prep</text>
    <text x="20" y="190" class="f" font-size="12" fill="#334155">• Ideal for FBA &amp; TikTok validation</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(340, 114)">
    <rect width="280" height="230" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="34" class="f" font-size="11" font-weight="800" fill="#2563eb">TIER 2 · PRIVATE LABEL &amp; LOGO</text>
    <text x="20" y="62" class="f" font-size="20" font-weight="800" fill="#0f172a">500 – 1,000+ pcs</text>
    <text x="20" y="84" class="f" font-size="12" font-weight="700" fill="#1d4ed8">Brand Ready · $0 Mold Fee</text>
    <line x1="20" y1="100" x2="260" y2="100" stroke="#bfdbfe"/>
    <text x="20" y="124" class="f" font-size="12" fill="#1e293b">• Custom Pantone body colors</text>
    <text x="20" y="146" class="f" font-size="12" fill="#1e293b">• Elastic pad / UV logo printing</text>
    <text x="20" y="168" class="f" font-size="12" fill="#1e293b">• Custom window boxes &amp; PDQ trays</text>
    <text x="20" y="190" class="f" font-size="12" fill="#1e293b">• 7–14 day custom production</text>
