    <text x="20" y="124" class="f" font-size="12" fill="#1e293b">• Exclusive NDA 3D steel tooling</text>
    <text x="20" y="146" class="f" font-size="12" fill="#1e293b">• 14–20 days to T1 golden samples</text>
    <text x="20" y="168" class="f" font-size="12" fill="#1e293b">• Dedicated multi-cavity press line</text>
    <text x="20" y="190" class="f" font-size="12" fill="#1e293b">• Chain-store EDI carton compliance</text>
