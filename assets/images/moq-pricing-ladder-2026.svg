    <rect width="280" height="230" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="34" class="f" font-size="11" font-weight="800" fill="#047857">TIER 3 · EXCLUSIVE 3D OEM</text>
    <text x="20" y="62" class="f" font-size="20" font-weight="800" fill="#0f172a">3,000+ pcs / 20GP</text>
    <text x="20" y="84" class="f" font-size="12" font-weight="700" fill="#047857">100% Mold Rebate @ 30k pcs</text>
