<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="c-title c-desc">
  <title id="c-title">US Amazon FBA &amp; EU Toy Compliance Gate: 100% Water-Bead-Free Checklist</title>
  <desc id="c-desc">4-gate compliance verification process for XEA squishy toys: Zero Water Beads, ASTM F963-23 Mechanical &amp; Chemical, CPSIA Lead/Phthalates, and US CPC / EN71 Certificates.</desc>
  <defs><style>.f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}</style></defs>
  <rect width="960" height="400" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="960" height="84" rx="20" fill="#064e3b"/>
  <rect y="64" width="960" height="20" fill="#064e3b"/>
  <text x="36" y="34" class="f" font-size="12" font-weight="800" fill="#6ee7b7" letter-spacing="1.4">XEA QA &amp; EXPORT COMPLIANCE · ZERO-RECALL ARCHITECTURE</text>
  <text x="36" y="62" class="f" font-size="22" font-weight="800" fill="#ffffff">4-Gate Safety Checklist for US Amazon FBA &amp; EU Retail Approval</text>

  <g transform="translate(36, 110)">
    <rect width="208" height="228" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="18" y="34" class="f" font-size="11" font-weight="800" fill="#059669">GATE 1 · FILLING SAFETY</text>
    <text x="18" y="60" class="f" font-size="16" font-weight="800" fill="#0f172a">100% Bead-Free</text>
    <text x="18" y="88" class="f" font-size="12" fill="#334155">Zero super-absorbent</text>
    <text x="18" y="106" class="f" font-size="12" fill="#334155">polymer water beads.</text>
    <text x="18" y="132" class="f" font-size="12" fill="#334155">Uses food-grade maltose</text>
    <text x="18" y="150" class="f" font-size="12" fill="#334155">gel, TPR blocks, slushie,</text>
    <text x="18" y="168" class="f" font-size="12" fill="#334155">or non-toxic flour dough.</text>
    <rect x="18" y="186" width="172" height="26" rx="6" fill="#059669"/>
    <text x="104" y="203" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#ffffff">ZERO CPSC BAN RISK</text>
  </g>

  <g transform="translate(262, 110)">
    <rect width="208" height="228" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="18" y="34" class="f" font-size="11" font-weight="800" fill="#2563eb">GATE 2 · US TOY STANDARD</text>
    <text x="18" y="60" class="f" font-size="16" font-weight="800" fill="#0f172a">ASTM F963-23</text>
    <text x="18" y="88" class="f" font-size="12" fill="#334155">16 CFR Part 1250</text>
    <text x="18" y="106" class="f" font-size="12" fill="#334155">mechanical torque,</text>
    <text x="18" y="124" class="f" font-size="12" fill="#334155">tension, drop, seam</text>
    <text x="18" y="142" class="f" font-size="12" fill="#334155">strength &amp; small-parts</text>
    <text x="18" y="160" class="f" font-size="12" fill="#334155">choking verification.</text>
    <rect x="18" y="186" width="172" height="26" rx="6" fill="#2563eb"/>
    <text x="104" y="203" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#ffffff">LAB VERIFIED</text>
  </g>

  <g transform="translate(488, 110)">
    <rect width="208" height="228" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="34" class="f" font-size="11" font-weight="800" fill="#334155">GATE 3 · CHEMICAL SCREEN</text>
    <text x="18" y="60" class="f" font-size="16" font-weight="800" fill="#0f172a">CPSIA &amp; EN71-3</text>
    <text x="18" y="88" class="f" font-size="12" fill="#334155">Total lead (&lt;100 ppm),</text>
    <text x="18" y="106" class="f" font-size="12" fill="#334155">8 regulated phthalates</text>
    <text x="18" y="124" class="f" font-size="12" fill="#334155">(&lt;0.1%), BPA-free,</text>
    <text x="18" y="142" class="f" font-size="12" fill="#334155">and EU 19 heavy-metal</text>
    <text x="18" y="160" class="f" font-size="12" fill="#334155">migration compliance.</text>
    <rect x="18" y="186" width="172" height="26" rx="6" fill="#334155"/>
    <text x="104" y="203" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#ffffff">US &amp; EU SAFE</text>
  </g>

  <g transform="translate(714, 110)">
    <rect width="210" height="228" rx="14" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
    <text x="18" y="34" class="f" font-size="11" font-weight="800" fill="#b45309">GATE 4 · PAPERWORK</text>
    <text x="18" y="60" class="f" font-size="16" font-weight="800" fill="#0f172a">US CPC + CE</text>
    <text x="18" y="88" class="f" font-size="12" fill="#334155">Ready-to-upload US</text>
    <text x="18" y="106" class="f" font-size="12" fill="#334155">Children&apos;s Product</text>
    <text x="18" y="124" class="f" font-size="12" fill="#334155">Certificate, batch code</text>
    <text x="18" y="142" class="f" font-size="12" fill="#334155">tracking label &amp; EU</text>
    <text x="18" y="160" class="f" font-size="12" fill="#334155">Declaration of Conformity.</text>
    <rect x="18" y="186" width="174" height="26" rx="6" fill="#d97706"/>
    <text x="105" y="203" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#ffffff">FBA UPLOAD READY</text>
  </g>

  <text x="36" y="376" class="f" font-size="11" fill="#64748b">Every XEA wholesale quote includes free PDF copies of current lab reports before deposit.</text>
</svg>
